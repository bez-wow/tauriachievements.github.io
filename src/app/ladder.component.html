<app-update-bar
  [lastEdited]="lastEdited()"
  [lastEditedTimeZoneLabel]="lastEditedTimeZoneLabel()" />

<div class="ladder-container">
  <app-filter-bar
    [sort]="currentSort()"
    [realm]="currentRealm()"
    [faction]="currentFaction()"
    [playerClass]="currentClass()"
    [pageSize]="pageSize()"
    [searchTerm]="searchTerm()"
    [sortOptions]="sortOptions"
    [realmOptions]="realmOptions"
    [factionOptions]="factionOptions"
    [classOptions]="classOptions"
    [pageSizeOptions]="pageSizeOptions"
    (sortChange)="setSort($event)"
    (realmChange)="setRealm($event)"
    (factionChange)="setFaction($event)"
    (classChange)="setClass($event)"
    (pageSizeChange)="setPageSize($event)"
    (searchChange)="onSearchChange($event)"
    (reset)="resetFilters()" />

  <div class="ladder-status-banner info" *ngIf="showRefreshingBanner()">
    <span>{{ syncMessage() || 'Refreshing ladder data...' }}</span>
  </div>

  <div class="ladder-status-banner warning" *ngIf="showErrorBanner()">
    <span>{{ loadError() }}</span>
    <button type="button" class="status-action" (click)="syncData()">Try again</button>
  </div>

  <div class="ladder-feedback loading" *ngIf="showLoadingState()">
    <div class="feedback-spinner" aria-hidden="true"></div>
    <h2>{{ loadingTitle() }}</h2>
    <p *ngIf="loadingHint()">{{ loadingHint() }}</p>
  </div>

  <div class="ladder-feedback error" *ngIf="showErrorState()">
    <h2>Could not load ladder data</h2>
    <p>{{ loadError() }}</p>
    <button type="button" class="feedback-action" (click)="syncData()">Try again</button>
  </div>

  <div class="ladder-feedback empty" *ngIf="showEmptyState()">
    <h2>{{ emptyStateTitle() }}</h2>
    <p>{{ emptyStateMessage() }}</p>
    <p *ngIf="emptyStateHint()">{{ emptyStateHint() }}</p>
    <button type="button" class="feedback-action" *ngIf="hasNarrowingFilters()" (click)="resetFilters()">Reset filters</button>
  </div>

  <app-leaderboard-table
    *ngIf="players().length > 0 && !showLoadingState()"
    [players]="players()"
    [currentSort]="currentSort()" />
</div>

<app-back-to-top-button />
