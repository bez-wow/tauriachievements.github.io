<app-update-bar
  [lastEdited]="lastEdited()"
  [lastEditedTimeZoneLabel]="lastEditedTimeZoneLabel()" />

<div class="movement-page-container">
  <div class="movement-filter-bar" *ngIf="historyAvailable()">
    <div class="movement-filter-group reset-group">
      <button type="button" class="movement-reset-button" (click)="resetFilters()">Reset</button>
    </div>

    <div class="movement-filter-group" *ngFor="let dropdown of dropdowns; trackBy: trackDropdown">
      <app-filter-dropdown
        [dropdownId]="dropdown.key"
        [triggerId]="dropdown.triggerId"
        [ariaLabel]="dropdown.ariaLabel"
        [options]="dropdown.options"
        [selectedValue]="dropdown.selectedValue"
        [selectedLabel]="dropdown.selectedLabel"
        [selectedIcon]="dropdown.selectedIcon"
        [showIcons]="dropdown.showIcons ?? false"
        (selectionChange)="onDropdownSelection(dropdown.key, $event)" />
    </div>
  </div>

  <app-history-summary
    *ngIf="historyAvailable(); else historyUnavailable"
    [comparisonLabel]="comparisonLabel()"
    [achievementMovers]="achievementMovers()"
    [honorableKillMovers]="honorableKillMovers()"
    [achievementEmptyMessage]="achievementEmptyMessage()"
    [honorableKillEmptyMessage]="honorableKillEmptyMessage()" />
</div>

<ng-template #historyUnavailable>
  <div class="movement-page-container">
    <div class="movement-feedback">
      <h2>Historical movement is not available yet</h2>
      <p>Generate at least two snapshots and reload the page to compare changes over time.</p>
    </div>
  </div>
</ng-template>
