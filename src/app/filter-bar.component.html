<div class="ladder-header">
  <div class="filter-group reset-group">
    <button type="button" class="reset-button" (click)="resetFilters()">Reset</button>
  </div>

  <div class="filter-group">
    <div class="dropdown" [class.open]="sortMenuOpen">
      <button
        #sortTrigger
        id="sortSelect"
        type="button"
        class="filter-select dropdown-trigger"
        aria-haspopup="listbox"
        aria-label="Sort by"
        [attr.aria-controls]="'sortMenu'"
        [attr.aria-expanded]="sortMenuOpen"
        (click)="toggleSortMenu()"
        (focus)="closeAllDropdowns('sort')"
        (keydown)="onDropdownTriggerKeydown($event, 'sort')">
        <span class="option-label">{{ selectedSortLabel }}</span>
      </button>
      <div
        id="sortMenu"
        class="dropdown-menu"
        role="listbox"
        aria-label="Sort by"
        [attr.aria-hidden]="!sortMenuOpen">
        <button
          #sortOption
          type="button"
          class="dropdown-option"
          *ngFor="let opt of sortOptions; let i = index"
          role="option"
          [attr.aria-selected]="sort === opt.value"
          [attr.tabindex]="sortMenuOpen ? 0 : -1"
          (click)="selectSort(opt)"
          (keydown)="onDropdownOptionKeydown($event, 'sort', i)">
          <span class="option-label">{{ opt.label }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="filter-group">
    <div class="dropdown" [class.open]="realmMenuOpen">
      <button
        #realmTrigger
        id="realmSelect"
        type="button"
        class="filter-select dropdown-trigger"
        aria-haspopup="listbox"
        aria-label="Realm"
        [attr.aria-controls]="'realmMenu'"
        [attr.aria-expanded]="realmMenuOpen"
        (click)="toggleRealmMenu()"
        (focus)="closeAllDropdowns('realm')"
        (keydown)="onDropdownTriggerKeydown($event, 'realm')">
        <span class="option-label">{{ selectedRealmLabel }}</span>
      </button>
      <div
        id="realmMenu"
        class="dropdown-menu"
        role="listbox"
        aria-label="Realm"
        [attr.aria-hidden]="!realmMenuOpen">
        <button
          #realmOption
          type="button"
          class="dropdown-option"
          *ngFor="let opt of realmOptions; let i = index"
          role="option"
          [attr.aria-selected]="realm === opt.value"
          [attr.tabindex]="realmMenuOpen ? 0 : -1"
          (click)="selectRealm(opt)"
          (keydown)="onDropdownOptionKeydown($event, 'realm', i)">
          <span class="option-label">{{ opt.label }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="filter-group">
    <div class="dropdown has-icons" [class.open]="classMenuOpen">
      <button
        #classTrigger
        id="classSelect"
        type="button"
        class="filter-select dropdown-trigger"
        [class.no-icon]="!selectedClassIcon"
        aria-haspopup="listbox"
        aria-label="Class"
        [attr.aria-controls]="'classMenu'"
        [attr.aria-expanded]="classMenuOpen"
        (click)="toggleClassMenu()"
        (focus)="closeAllDropdowns('class')"
        (keydown)="onDropdownTriggerKeydown($event, 'class')">
        <img *ngIf="selectedClassIcon" [src]="selectedClassIcon" alt="Selected class icon" class="option-icon" />
        <span *ngIf="!selectedClassIcon" class="option-icon placeholder"></span>
        <span class="option-label">{{ selectedClassLabel }}</span>
      </button>
      <div
        id="classMenu"
        class="dropdown-menu"
        role="listbox"
        aria-label="Class"
        [attr.aria-hidden]="!classMenuOpen">
        <button
          #classOption
          type="button"
          class="dropdown-option no-icon"
          role="option"
          [attr.aria-selected]="playerClass === undefined"
          [attr.tabindex]="classMenuOpen ? 0 : -1"
          (click)="selectClass()"
          (keydown)="onDropdownOptionKeydown($event, 'class', 0)">
          <span class="option-icon placeholder"></span>
          <span class="option-label">All Classes</span>
        </button>
        <button
          #classOption
          type="button"
          class="dropdown-option"
          *ngFor="let cls of classOptions; let i = index"
          role="option"
          [attr.aria-selected]="playerClass === cls.id"
          [attr.tabindex]="classMenuOpen ? 0 : -1"
          (click)="selectClass(cls)"
          (keydown)="onDropdownOptionKeydown($event, 'class', i + 1)">
          <img [src]="cls.icon" [alt]="cls.name + ' icon'" class="option-icon" />
          <span class="option-label">{{ cls.name }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="filter-group">
    <div class="dropdown" [class.open]="factionMenuOpen">
      <button
        #factionTrigger
        id="factionSelect"
        type="button"
        class="filter-select dropdown-trigger"
        aria-haspopup="listbox"
        aria-label="Faction"
        [attr.aria-controls]="'factionMenu'"
        [attr.aria-expanded]="factionMenuOpen"
        (click)="toggleFactionMenu()"
        (focus)="closeAllDropdowns('faction')"
        (keydown)="onDropdownTriggerKeydown($event, 'faction')">
        <span class="option-label">{{ selectedFactionLabel }}</span>
      </button>
      <div
        id="factionMenu"
        class="dropdown-menu"
        role="listbox"
        aria-label="Faction"
        [attr.aria-hidden]="!factionMenuOpen">
        <button
          #factionOption
          type="button"
          class="dropdown-option"
          *ngFor="let opt of factionOptions; let i = index"
          role="option"
          [attr.aria-selected]="faction === opt.value"
          [attr.tabindex]="factionMenuOpen ? 0 : -1"
          (click)="selectFaction(opt)"
          (keydown)="onDropdownOptionKeydown($event, 'faction', i)">
          <span class="option-label">{{ opt.label }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="filter-group">
    <input
      id="nameGuildSearch"
      type="search"
      class="filter-select search-input"
      [value]="searchTerm"
      placeholder="Name or guild"
      aria-label="Search by character name or guild"
      (input)="onSearchInput($event)" />
  </div>

  <div class="filter-group">
    <div class="page-size">
      <button type="button" class="page-size-button page-size-reset-inline" (click)="resetFilters()">Reset</button>
      <button
        type="button"
        class="page-size-button"
        *ngFor="let size of pageSizeOptions"
        [class.active]="pageSize === size"
        [attr.aria-label]="'Show ' + size + ' entries'"
        (click)="onPageSizeSelect(size)">{{ size }}</button>
    </div>
  </div>
</div>
