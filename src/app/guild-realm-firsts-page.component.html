<app-update-bar
  [lastEdited]="lastEdited()"
  [lastEditedTimeZoneLabel]="lastEditedTimeZoneLabel()" />

<main class="realm-firsts-page">
  <div class="realm-firsts-feedback loading" *ngIf="isLoading()">
    <div class="feedback-spinner" aria-hidden="true"></div>
    <h2>Loading raid history...</h2>
  </div>

  <div class="realm-firsts-feedback error" *ngIf="!isLoading() && loadError()">
    <h2>Could not load raid history</h2>
    <p>{{ loadError() }}</p>
    <button type="button" class="feedback-action" (click)="retryLoad()">Try again</button>
  </div>

  <div class="realm-firsts-feedback empty" *ngIf="!isLoading() && !loadError() && !hasRows()">
    <h2>No raid history available</h2>
    <p>The raid history data file is empty.</p>
  </div>

  <section class="realm-firsts-table-panel" *ngIf="hasRows()" aria-label="Raid history table">
    <div class="realm-firsts-table-scroll">
      <table class="realm-firsts-table">
        <thead>
          <tr>
            <th scope="col" class="expansion-column" aria-label="Expansion"></th>
            <th scope="col" class="achievement-column">Achievement</th>
            <th scope="col" class="realm-column" *ngFor="let realm of realms()">{{ realm }}</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let row of rows(); let rowIndex = index; trackBy: trackRow">
            <tr *ngIf="row.startsExpansionGroup" class="expansion-separator-row" aria-hidden="true">
              <td [attr.colspan]="realms().length + 2"></td>
            </tr>

            <tr [class.is-even-achievement-row]="rowIndex % 2 === 1">
              <td
                *ngIf="row.showsExpansionLogo && row.expansion"
                class="expansion-logo-cell"
                [attr.rowspan]="row.expansionRowSpan">
                <img
                  class="expansion-logo"
                  [src]="row.expansion.logoUrl"
                  [alt]="row.expansion.name"
                  [title]="row.expansion.name"
                  loading="lazy" />
              </td>
              <td
                *ngIf="!row.expansion"
                class="expansion-logo-cell expansion-logo-cell--empty"
                aria-hidden="true"></td>
              <th scope="row">
                <span class="achievement-label">
                  <span *ngIf="row.iconUrl" class="achievement-icon-frame" aria-hidden="true">
                    <img
                      class="achievement-icon"
                      [src]="row.iconUrl"
                      alt=""
                      loading="lazy" />
                  </span>
                  <span class="achievement-name">{{ row.name }}</span>
                </span>
              </th>
              <td
                *ngFor="let cell of row.cells; trackBy: trackCell"
                class="realm-cell"
                [class.is-empty]="!cell.guild"
                [class.has-video]="cell.hasVideo">
                <a
                  *ngIf="cell.guild && cell.hasVideo; else guildNameCell"
                  class="guild-video-link"
                  [href]="cell.videoUrl"
                  target="_blank"
                  rel="noopener noreferrer"
                  [title]="getVideoTitle(row, cell)">
                  <span>{{ cell.guild }}</span>
                  <img
                    *ngIf="cell.guild === legionWhenGuild"
                    class="guild-emote guild-emote--pepega"
                    [src]="pepegaEmoteUrl"
                    alt="Pepega"
                    loading="lazy" />
                </a>

                <ng-template #guildNameCell>
                  <span *ngIf="cell.guild; else missingWinner" class="guild-name">
                    <span>{{ cell.guild }}</span>
                    <img
                      *ngIf="cell.guild === legionWhenGuild"
                      class="guild-emote guild-emote--pepega"
                      [src]="pepegaEmoteUrl"
                      alt="Pepega"
                      loading="lazy" />
                  </span>
                </ng-template>

                <ng-template #missingWinner>
                  <span class="missing-winner">-</span>
                </ng-template>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </section>
</main>

<app-back-to-top-button />
