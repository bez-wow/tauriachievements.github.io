<section class="chart-card" aria-labelledby="raid-spec-chart-title">
  <header class="chart-header">
    <div class="chart-heading">
      <h2 id="raid-spec-chart-title">Spec Popularity · {{ raidName() }}</h2>
      <p class="chart-subtitle" *ngIf="!loading() && !error()">{{ subtitle() }}</p>
    </div>

    <div class="chart-filters">
      <div class="segmented difficulty-filter" role="group" aria-label="Raid difficulty" appGlide>
        <button
          *ngFor="let difficulty of shownDifficulties(); trackBy: trackDifficulty"
          type="button"
          [class.active]="selectedDifficulty() === difficulty.slug"
          [attr.aria-pressed]="selectedDifficulty() === difficulty.slug"
          (click)="difficultyChange.emit(difficulty.slug)">
          {{ difficultyLabel(difficulty) }}
        </button>
      </div>

      <div class="segmented role-filter" role="group" aria-label="Filter by role" appGlide>
        <button
          *ngFor="let option of roleOptions"
          type="button"
          [class.active]="role() === option.value"
          [attr.aria-pressed]="role() === option.value"
          (click)="role.set(option.value)">
          {{ option.label }}
        </button>
      </div>
    </div>
  </header>

  <div class="chart-state" role="status" *ngIf="loading()">
    <span class="state-spinner" aria-hidden="true"></span>
    <span>Reading {{ selectedDifficultyName() }} raid rosters…</span>
  </div>

  <div class="chart-state chart-error" role="alert" *ngIf="!loading() && error()">
    <span>{{ error() }}</span>
    <button type="button" (click)="retry.emit()">Try again</button>
  </div>

  <div class="chart-scroll" *ngIf="!loading() && !error() && popularity().total > 0">
    <div class="chart" appReveal>
      <div class="y-axis" aria-hidden="true">
        <span *ngFor="let line of gridlines()" [style.bottom.%]="line.position">{{ line.value }}%</span>
      </div>

      <div class="plot" [appFlip]="groups()">
        <div class="gridlines" aria-hidden="true">
          <span *ngFor="let line of gridlines()" [style.bottom.%]="line.position"></span>
        </div>

        <div
          class="class-group"
          *ngFor="let group of groups(); let index = index; trackBy: trackGroup"
          [attr.data-flip]="group.classId"
          [style.--i]="index"
          [style.--class-color]="group.color"
          [class.flip]="index >= groups().length / 2">
          <div class="bars">
            <button
              class="bar-slot"
              type="button"
              appTapTooltip
              *ngFor="let spec of group.specs; let specIndex = index; trackBy: trackSpec"
              [style.--s]="specIndex"
              [attr.aria-label]="spec.spec + ' ' + group.className + ': ' + spec.shareLabel + ', ' + spec.count.toLocaleString('en-US') + ' player slots'">
              <span
                class="bar"
                [class.empty]="spec.count === 0"
                [attr.data-flip-height]="group.classId + '-' + spec.spec"
                [style.height.%]="spec.heightPercent"
                [style.background-color]="group.color">
                <span class="bar-value" *ngIf="spec.showValue">{{ spec.shareLabel }}</span>
                <span class="tooltip" aria-hidden="true">
                  <strong>{{ spec.shareLabel }}</strong>
                  <span>{{ spec.spec }} {{ group.className }}</span>
                  <span class="tooltip-meta">{{ spec.count | number }} of {{ popularity().total | number }} player slots</span>
                </span>
              </span>
            </button>
          </div>

          <div class="spec-icons" aria-hidden="true">
            <ng-container *ngFor="let spec of group.specs; trackBy: trackSpec">
              <img
                *ngIf="spec.icon; else iconPlaceholder"
                [src]="spec.icon"
                alt=""
                [title]="spec.spec"
                [class.empty]="spec.count === 0"
                loading="lazy" />
              <ng-template #iconPlaceholder>
                <span class="icon-placeholder" [title]="spec.spec"></span>
              </ng-template>
            </ng-container>
          </div>

          <div class="class-label">
            <img [src]="group.classIcon" alt="" />
            <span>{{ group.className }}</span>
            <span class="class-share">{{ group.shareLabel }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="chart-empty" *ngIf="!loading() && !error() && popularity().total === 0">
    No player rosters were recorded for {{ selectedDifficultyName() }}.
  </p>
</section>
