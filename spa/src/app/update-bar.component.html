<header class="update-bar" [class.is-menu-open]="openSectionId() !== null">
  <div class="site-bar">
    <span class="brand-spacer" aria-hidden="true"></span>

    <nav class="site-nav" aria-label="Primary">
      <ul class="site-nav-list">
        <li
          *ngFor="let section of sections"
          class="site-nav-item"
          [class.is-current]="location()?.section === section"
          [class.is-open]="openSectionId() === section.id"
          [attr.data-nav-section]="section.id"
          (focusout)="onSectionFocusOut(section, $event)">
          <ng-container *ngIf="section.pages.length > 1; else directLink">
            <button
              type="button"
              class="site-nav-trigger"
              [attr.aria-expanded]="openSectionId() === section.id"
              [attr.aria-controls]="'nav-panel-' + section.id"
              (click)="toggleSection(section)"
              (pointerenter)="onTriggerPointerEnter(section, $event)">
              <span class="site-nav-icon" aria-hidden="true">{{ section.icon }}</span>
              <span>{{ section.label }}</span>
              <span class="site-nav-new" *ngIf="section.isNew">New</span>
              <svg class="site-nav-chevron" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
                <path d="M3 4.5l3 3 3-3"/>
              </svg>
            </button>

            <div
              class="site-nav-panel"
              [id]="'nav-panel-' + section.id"
              [hidden]="openSectionId() !== section.id">
              <ul class="site-nav-pages">
                <li *ngFor="let page of section.pages">
                  <a
                    class="site-nav-page"
                    [class.is-current]="location()?.page === page"
                    [attr.aria-current]="location()?.page === page ? 'page' : null"
                    [routerLink]="page.path"
                    (click)="closeMenu()">
                    <span class="site-nav-page-icon" aria-hidden="true">{{ page.icon }}</span>
                    <span class="site-nav-page-label">{{ page.label }}</span>
                  </a>
                </li>
              </ul>
            </div>
          </ng-container>

          <ng-template #directLink>
            <a
              class="site-nav-trigger"
              [routerLink]="section.pages[0].path"
              [attr.aria-current]="location()?.section === section ? 'page' : null"
              (click)="closeMenu()">
              <span class="site-nav-icon" aria-hidden="true">{{ section.icon }}</span>
              <span>{{ section.label }}</span>
            </a>
          </ng-template>
        </li>
      </ul>
    </nav>

    <div class="update-bar-actions">
      <a
        class="discord-link"
        href="https://discord.gg/JMHnDmh2bP"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Join Discord server">
        <span class="discord-link-text">Join Discord</span>
        <svg class="discord-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
        </svg>
      </a>
    </div>
  </div>

</header>

<div class="site-nav-backdrop" [class.is-open]="openSectionId() !== null" aria-hidden="true"></div>
