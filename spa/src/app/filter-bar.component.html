<div id="ladder-filters" class="ladder-header" [class.filters-collapsed]="!filtersOpen">
  <div class="filter-group reset-group">
    <button type="button" class="reset-button" (click)="resetFilters()">Reset</button>
  </div>

  <app-mobile-filter-toggle
    controlsId="ladder-filters"
    [expanded]="filtersOpen"
    [activeFilters]="activeFilterLabels"
    (expandedChange)="filtersOpen = $event" />

  <div class="filter-group collapsible-filter" [ngClass]="'filter-group--' + dropdown.key" *ngFor="let dropdown of dropdowns; trackBy: trackDropdown">
    <app-filter-dropdown
      [dropdownId]="dropdown.key"
      [triggerId]="dropdown.triggerId"
      [ariaLabel]="dropdown.ariaLabel"
      [options]="dropdown.options"
      [selectedValue]="dropdown.selectedValue"
      [selectedLabel]="dropdown.selectedLabel"
      [selectedIcon]="dropdown.selectedIcon"
      [showIcons]="dropdown.showIcons ?? false"
      (selectionChange)="onDropdownSelection(dropdown.key, $event)" />
  </div>

  <div class="filter-group filter-group--search">
    <input
      id="nameGuildSearch"
      type="search"
      class="filter-select search-input"
      [value]="searchTerm"
      placeholder="Name or guild"
      aria-label="Search by character name or guild"
      (input)="onSearchInput($event)" />
  </div>

  <div class="filter-group filter-group--page-size collapsible-filter">
    <div class="page-size">
      <button type="button" class="page-size-button page-size-reset-inline" (click)="resetFilters()">Reset</button>
      <button
        type="button"
        class="page-size-button"
        *ngFor="let size of pageSizeOptions"
        [class.active]="pageSize === size"
        [attr.aria-label]="'Show ' + size + ' entries'"
        (click)="onPageSizeSelect(size)">{{ size }}</button>
    </div>
  </div>
</div>
